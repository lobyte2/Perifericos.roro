<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Usuarios</title>
  <link href="styles.css" rel="stylesheet"/>
  <script defer src="app.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container nav">
      <a href="index.html"><strong>Tienda</strong></a>
      <nav style="display:flex; gap:10px; align-items:center">
        <a href="productos.html">Productos</a>
        <a href="blog.html">Blog</a>
        <a href="contacto.html">Contacto</a>
        <a href="registro.html">Registro</a>
        <a href="login.html">Login</a>
        <a href="admin.html">Admin</a>
        <span class="badge">🛒 <span id="cart-badge">0</span></span>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="container">
    <h1>Gestión de Usuarios</h1>

    <table class="table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Correo</th>
        </tr>
      </thead>
      <tbody id="lista-usuarios">
      </tbody>
    </table>

    <h2>Nuevo usuario</h2>
    <form class="form" id="form-usuarios">
      <input class="input" name="nombre" placeholder="Nombre"/>
      <input class="input" name="email" placeholder="Correo"/>
      <button class="btn">Crear</button>
    </form>
  </main>

  <!-- Footer -->
  <footer class="container footer">
    © 2025 Mi Tienda
  </footer>

</body>
</html>
