<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Registro</title>
  <link href="styles.css" rel="stylesheet"/>
  <script defer src="app.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container nav">
      <a href="index.html"><strong>Perifericos.roro</strong></a>
      <nav style="display:flex; gap:10px; align-items:center">
        <a href="productos.html">Productos</a>
        <a href="blog.html">Blog</a>
        <a href="contacto.html">Contacto</a>
        <a href="registro.html">Registro</a>
        <a href="login.html">Login</a>
        <a href="admin.html">Admin</a>
        <span class="badge">🛒 <span id="cart-badge">0</span></span>
      </nav>
    </div>
  </header>

  <!-- Formulario de Registro -->
  <main class="container">
    <h1>Registro</h1>
    <form class="form" id="form-reg" novalidate>
      <div class="row">
        <label class="label">Nombre</label>
        <input class="input" name="nombre"/>
        <div class="error" id="e-nombre"></div>
      </div>
      <div class="row">
        <label class="label">Correo</label>
        <input class="input" name="email"/>
        <div class="error" id="e-email"></div>
      </div>
      <div class="row">
        <label class="label">Contraseña</label>
        <input class="input" name="pass" type="password"/>
        <div class="error" id="e-pass"></div>
      </div>
      <button class="btn">Crear cuenta</button>
    </form>
  </main>

  <!-- Footer -->
  <footer class="container footer">
    © 2025 Perifericos.roro
  </footer>

</body>
</html>
